# SPDX-License-Identifier: Apache-2.0
name: Release

# A tag vX.Y.Z or vX.Y.Z-rc.N on main publishes a GitHub release with the conformance
# report of that commit, attested by GitHub (actions/attest-build-provenance). The release
# exists only if the report was produced: a tag whose conformance run fails publishes
# nothing.
#
# Guards: tags are immutable (repository ruleset). Before anything runs, the tag must point
# to a commit on main that came from a pull request whose checks all passed, match the
# version in pyproject.toml, and the release must not exist yet.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Check the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # the pull request the commit came from
      checks: read # its checks
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # main's history, to check where the tag points
          persist-credentials: false

      - name: Tag, branch and version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?)$ ]]; then
            echo "::error::tag $TAG is neither vX.Y.Z nor vX.Y.Z-rc.N"; exit 1
          fi
          version="${BASH_REMATCH[1]}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points to a commit that is not on main"; exit 1
          fi
          project=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          if [ "$project" != "$version" ]; then
            echo "::error::pyproject.toml has version '$project', the tag $version"; exit 1
          fi
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          { echo "version=$version"; echo "prerelease=$prerelease"; } >> "$GITHUB_OUTPUT"

      # main takes squash-merged pull requests; their checks ran on the pull request's head.
      - name: The pull request's checks passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          heads=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main") | .head.sha] | unique | .[]')
          if [ "$(printf '%s\n' "$heads" | grep -c .)" != 1 ]; then
            echo "::error::$GITHUB_SHA did not come from exactly one merged pull request into main"; exit 1
          fi
          runs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$heads/check-runs?per_page=100" \
            --jq '.check_runs[] | "\(.status)|\(.conclusion)|\(.name)"')
          printf '%s\n' "$runs"
          for required in "Lint, types and tests" "Conformance (" "Fuzz ("; do
            grep -qF "|$required" <<< "$runs" || { echo "::error::check '$required' did not run"; exit 1; }
          done
          if grep -vE '^completed\|(success|skipped|neutral)\|' <<< "$runs"; then
            echo "::error::not every check of the pull request passed"; exit 1
          fi

      - name: Not released yet
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::release $TAG exists already"; exit 1
          fi

  conformance:
    name: Conformance report
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: python -m pip install -e .
      - name: Run mandate-conformance
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          eval "$(python3 - <<'PY'
          import re, shlex, tomllib
          hm = tomllib.load(open("pyproject.toml", "rb"))["tool"]["home-mandate"]
          assert re.fullmatch(r"v\d+\.\d+\.\d+(-[a-z]+\.\d+)?", hm["spec"]), hm["spec"]
          assert re.fullmatch(r"[a-z-]+(,[a-z-]+)*", hm["classes"]), hm["classes"]
          print(f"SPEC={shlex.quote(hm['spec'])}; CLASSES={shlex.quote(hm['classes'])}")
          PY
          )"
          test -f src/home_mandate_spec/harness.py || { echo "::error::no harness, nothing to release"; exit 1; }
          go install "github.com/home-mandate/spec/cmd/mandate-conformance@$SPEC"
          "$(go env GOPATH)/bin/mandate-conformance" -report conformance-report.json \
            -classes "$CLASSES" -name home-mandate-spec -version "$VERSION" \
            -exec python -m home_mandate_spec.harness
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-report
          path: conformance-report.json
          if-no-files-found: error
          retention-days: 1

  # Without the code under test: only this job may sign and create the release.
  publish:
    name: Attest and release
    needs: [verify, conformance]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the release and its asset
      id-token: write # the attestation's signing certificate
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conformance-report
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: conformance-report.json
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(--repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "$TAG" conformance-report.json "${args[@]}"

# SPDX-License-Identifier: Apache-2.0
name: Integration

# The test tool of the specification against the harness, and short fuzzing, for every
# push into a pull request against main. The tag of the Home-Mandate Specification and the
# classes claimed are in pyproject.toml ([tool.home-mandate]); the test tool of that tag is
# used. No run after the merge. Long fuzzing runs twice a month in scheduled.yml.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Conformance (mandate-conformance)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: python -m pip install -e .
      - name: Specification tag and classes
        id: spec
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re, tomllib
          hm = tomllib.load(open("pyproject.toml", "rb"))["tool"]["home-mandate"]
          assert re.fullmatch(r"v\d+\.\d+\.\d+(-[a-z]+\.\d+)?", hm["spec"]), hm["spec"]
          assert re.fullmatch(r"[a-z-]+(,[a-z-]+)*", hm["classes"]), hm["classes"]
          print(f"tag={hm['spec']}")
          print(f"classes={hm['classes']}")
          PY
      # Until the harness exists there is nothing to test; the job says so and passes, so
      # that the first pull requests can be merged. From the first harness on, this is
      # the conformance check that guards main.
      - name: Harness present
        id: harness
        run: |
          if [ -f src/home_mandate_spec/harness.py ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::src/home_mandate_spec/harness.py does not exist yet, nothing to test"; fi
      - if: steps.harness.outputs.present == 'true'
        run: go install "github.com/home-mandate/spec/cmd/mandate-conformance@${{ steps.spec.outputs.tag }}"
      - if: steps.harness.outputs.present == 'true'
        run: >
          "$(go env GOPATH)/bin/mandate-conformance" -report report.json
          -classes "${{ steps.spec.outputs.classes }}"
          -exec python -m home_mandate_spec.harness

  fuzz:
    name: Fuzz (short)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      # Property-based tests of the parsers (mandates, requests, later audit logs and
      # signatures) live in tests/fuzz/; each runs for a short time here.
      - name: Fuzz targets present
        id: targets
        run: |
          if ls tests/fuzz/test_*.py > /dev/null 2>&1; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::tests/fuzz/ has no targets yet"; fi
      - if: steps.targets.outputs.present == 'true'
        run: pytest tests/fuzz
        env:
          HYPOTHESIS_PROFILE: short # 60 seconds per target; the profile is defined in tests/fuzz/conftest.py

# SPDX-License-Identifier: Apache-2.0
name: Release

# A tag vX.Y.0-alpha.N, vX.Y.Z-rc.N or vX.Y.Z publishes a GitHub release with the conformance
# report of that commit, attested by GitHub (actions/attest-build-provenance). The release
# exists only if the report was produced: a tag whose conformance run fails publishes
# nothing.
#
# A release is a tag, not a commit (RELEASING.md of the organization): pyproject.toml carries
# X.Y.Z, and the conformance report names the version of the tag, X.Y.Z-rc.N for a release
# candidate. A release candidate is tagged on release/X.Y, published, and then runs the
# release gate: long fuzzing of every target. The version is tagged on the commit of a
# release candidate whose gate passed; this workflow then publishes without testing again.
#
# Guards: only admins and the maintainer may create tags, and tags and releases are immutable
# (repository settings). Before anything is published, home-mandate/.github/actions/release-verify
# checks where the tag stands, that the commit came from a merged pull request whose checks
# passed, that a version is a release candidate that passed, and that the release doesn't
# exist. Here: the tag matches the version in pyproject.toml, and a version names a version of
# the specification, not a release candidate.
#
# Run by hand with a tag name, the workflow only checks whether that tag could be released
# from the head of the chosen branch, and publishes nothing. Do it before every tag:
#   gh workflow run release.yml --ref release/X.Y -f tag=vX.Y.Z-rc.1
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Dry run: the tag to check on the head of this branch. Publishes nothing."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Check the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # the pull request the commit came from
      checks: read # its checks
      actions: read # the run of the release candidate a version stands on
    outputs:
      version: ${{ steps.verify.outputs.version }}
      kind: ${{ steps.verify.outputs.kind }}
      prerelease: ${{ steps.verify.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the branches' history and the tags, to check where the tag stands
          persist-credentials: false

      - id: verify
        uses: home-mandate/.github/actions/release-verify@f73af670bc516d6556a0203315b90c0c6554852f
        with:
          tag: ${{ inputs.tag || github.ref_name }}
          required-checks: |
            Lint, types and tests
            Conformance (
            Fuzz (

      - name: The version and the specification in pyproject.toml
        env:
          BASE: ${{ steps.verify.outputs.base }}
          KIND: ${{ steps.verify.outputs.kind }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys, tomllib
          project = tomllib.load(open("pyproject.toml", "rb"))
          version, spec = project["project"]["version"], project["tool"]["home-mandate"]["spec"]
          errors = []
          if version != os.environ["BASE"]:
              errors.append(f"pyproject.toml has version {version}, the tag {os.environ['BASE']}")
          if not re.fullmatch(r"v\d+\.\d+\.\d+(-(alpha|rc)\.\d+)?", spec):
              errors.append(f"[tool.home-mandate] spec is not a tag: {spec}")
          # What becomes a version names versions (RELEASING.md, "Releases that depend on each other").
          elif os.environ["KIND"] == "version" and "-" in spec:
              errors.append(f"a version must name a version of the specification, not {spec}")
          for error in errors:
              print(f"::error::{error}")
          sys.exit(1 if errors else 0)
          PY

  conformance:
    name: Conformance report
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: python -m pip install -e .
      - name: Run mandate-conformance
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          eval "$(python3 - <<'PY'
          import re, shlex, tomllib
          hm = tomllib.load(open("pyproject.toml", "rb"))["tool"]["home-mandate"]
          assert re.fullmatch(r"v\d+\.\d+\.\d+(-[a-z]+\.\d+)?", hm["spec"]), hm["spec"]
          assert re.fullmatch(r"[a-z-]+(,[a-z-]+)*", hm["classes"]), hm["classes"]
          print(f"SPEC={shlex.quote(hm['spec'])}; CLASSES={shlex.quote(hm['classes'])}")
          PY
          )"
          test -f src/home_mandate_spec/harness.py || { echo "::error::no harness, nothing to release"; exit 1; }
          go install "github.com/home-mandate/spec/cmd/mandate-conformance@$SPEC"
          "$(go env GOPATH)/bin/mandate-conformance" -report conformance-report.json \
            -classes "$CLASSES" -name home-mandate-spec -version "$VERSION" \
            -exec python -m home_mandate_spec.harness
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-report
          path: conformance-report.json
          if-no-files-found: error
          retention-days: 1

  # Without the code under test: only this job may sign and create the release.
  publish:
    name: Attest and release
    needs: [verify, conformance]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the release and its asset
      id-token: write # the attestation's signing certificate
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conformance-report
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: conformance-report.json
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(--repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "$TAG" conformance-report.json "${args[@]}"

  # The release gate, for a release candidate only: what is too long for every pull request.
  # Every target with the profile "long" (tests/fuzz/conftest.py), starting from the examples
  # the runs of scheduled.yml have kept. Until tests/fuzz/ has targets there is nothing to run;
  # the job says so and passes, like "Fuzz (short)" of the pull requests.
  fuzz:
    name: Fuzz (long)
    needs: [verify, publish]
    if: needs.verify.outputs.kind == 'rc'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      # The key never matches: the newest examples with the prefix are restored.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hypothesis/
          key: hypothesis-v1-${{ github.run_id }}
          restore-keys: hypothesis-v1-
      - name: Fuzz targets present
        id: targets
        run: |
          if ls tests/fuzz/test_*.py > /dev/null 2>&1; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::tests/fuzz/ has no targets yet"; fi
      - if: steps.targets.outputs.present == 'true'
        run: pytest tests/fuzz
        env:
          HYPOTHESIS_PROFILE: long
      # A failing example is kept in .hypothesis/ with its seed; keep it to reproduce.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures
          path: .hypothesis/
          if-no-files-found: ignore
          include-hidden-files: true

  # The job release-verify looks for before a version may stand on this commit: it succeeds
  # only if the release candidate was published and every part of the gate passed.
  gate:
    name: Release gate
    needs: [verify, publish, fuzz]
    if: always() && github.event_name == 'push' && needs.verify.outputs.kind == 'rc'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "verify, publish, fuzz: $RESULTS"
          [ "$RESULTS" = "success success success" ]

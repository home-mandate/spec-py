# SPDX-License-Identifier: Apache-2.0
name: Scheduled

# Every night: the dependencies against the known vulnerabilities (pip-audit). On the 1st
# and the 15th: long fuzzing of every target. A failure of a scheduled run opens an issue
# in this repository, or comments on the open one.
on:
  schedule:
    - cron: "5 2 * * *" # security, every night
    - cron: "29 3 1,15 * *" # fuzzing, twice a month
  workflow_dispatch:
    inputs:
      what:
        description: "security or fuzz"
        required: true
        default: security
        type: choice
        options: [security, fuzz]

permissions:
  contents: read

jobs:
  security:
    name: Security (pip-audit)
    if: github.event.schedule == '5 2 * * *' || inputs.what == 'security'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: pip-audit --strict --skip-editable # the project itself is not on PyPI

  fuzz:
    name: Fuzz (long)
    if: github.event.schedule == '29 3 1,15 * *' || inputs.what == 'fuzz'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - name: Fuzz targets present
        id: targets
        run: |
          if ls tests/fuzz/test_*.py > /dev/null 2>&1; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::tests/fuzz/ has no targets yet"; fi
      - if: steps.targets.outputs.present == 'true'
        run: pytest tests/fuzz
        env:
          HYPOTHESIS_PROFILE: long # 45 minutes in all; the profile is defined in tests/fuzz/conftest.py
      # A failing example is kept in .hypothesis/ with its seed; keep it to reproduce.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures
          path: .hypothesis/
          if-no-files-found: ignore

  report:
    name: Report a failure
    needs: [security, fuzz]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "Scheduled check failed: ${{ github.event.schedule == '5 2 * * *' && 'security' || 'fuzzing' }}"
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number="$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == env.TITLE) | .number' | head -n 1)"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again: $RUN"
          else
            gh issue create --title "$TITLE" --body "The scheduled run failed: $RUN"
          fi
